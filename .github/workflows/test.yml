name: Test Dotfiles

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast Quality Gate
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Install check dependencies
        run: |
          ok=0
          for i in 1 2 3; do
            sudo timeout 120 apt-get update && { ok=1; break; }
            echo "apt-get update attempt $i failed; retrying"
            sleep 5
          done
          [ "$ok" = 1 ]
          sudo timeout 300 apt-get install -y direnv jq lua5.4 zsh
          bash .github/scripts/install-chezmoi.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run fast quality gate
        env:
          LUA_COMPILER: luac5.4
        run: just quality-gate

  changes:
    name: Detect Changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      zsh: ${{ steps.filter.outputs.zsh }}
      lua: ${{ steps.filter.outputs.lua }}
      nvim: ${{ steps.filter.outputs.nvim }}
      devbox: ${{ steps.filter.outputs.devbox }}
      chezmoi: ${{ steps.filter.outputs.chezmoi }}
      markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shell:
              - 'home/private_dot_zshrc.tmpl'
              - 'home/dot_zshenv.tmpl'
              - 'home/dot_config/zsh/features/devbox-brew.zsh'
              - 'home/dot_config/direnv/**'
              - 'install.sh'
              - 'home/.chezmoiscripts/**'
              - 'tests/devbox/**'
              - 'tests/zsh/*.test.sh'
              - '.github/scripts/install-chezmoi.sh'
              - '.github/workflows/**'
            zsh:
              - 'home/**/*.zsh'
              - 'home/**/*.zsh.tmpl'
              - 'home/dot_z*.tmpl'
              - 'home/private_dot_z*.tmpl'
              - 'home/dot_p10k.zsh'
              - 'justfile'
              - '.github/scripts/install-chezmoi.sh'
              - '.github/workflows/**'
            lua:
              - 'home/dot_config/nvim/**/*.lua'
              - '.github/workflows/**'
            nvim:
              - 'home/dot_config/nvim/**'
              - '.github/workflows/**'
            devbox:
              - 'home/dot_local/share/devbox/global/default/devbox.json.tmpl'
              - 'home/dot_config/zsh/features/devbox-brew.zsh'
              - 'home/homebrew/Brewfile'
              - 'home/homebrew/Brewfile.work'
              - 'tests/devbox/**'
              - 'tests/zsh/devbox-brew.test.sh'
              - 'justfile'
              - '.github/workflows/**'
            chezmoi:
              - '.chezmoiroot'
              - 'home/**'
              - '.github/scripts/install-chezmoi.sh'
              - '.github/workflows/**'
            markdown:
              - '**/*.md'
              - '.oxfmtrc.json'
              - '.github/workflows/**'

  format:
    name: Format Check
    needs: changes
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.lua == 'true' || needs.changes.outputs.devbox == 'true' || needs.changes.outputs.markdown == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install formatters
        run: |
          # shfmt (shell formatter)
          curl -sS https://webinstall.dev/shfmt | bash
          export PATH="$HOME/.local/bin:$PATH"

          # stylua (lua formatter)
          curl -sL https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip -o stylua.zip
          unzip stylua.zip -d /usr/local/bin
          chmod +x /usr/local/bin/stylua

      - name: Check shell format (shfmt)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking shell format..."

          # Check .sh scripts (shfmt does not support zsh; zsh syntax is checked by zsh -n in lint job)
          find . -type f \( -name "install.sh" -o -path "./home/.chezmoiscripts/*.sh" -o -path "./home/dot_config/direnv/direnvrc" -o -path "./.github/scripts/install-chezmoi.sh" -o -path "./tests/devbox/*.sh" -o -path "./tests/zsh/*.test.sh" \) -print0 | \
            xargs -0 shfmt -d -i 2 -ci

      - name: Check lua format (stylua)
        run: |
          echo "Checking lua format..."
          stylua --check home/dot_config/nvim/

      - name: Check Markdown format (oxfmt)
        run: |
          echo "Checking Markdown format..."
          git ls-files '*.md' \
            | grep -vE 'fixtures/|NOTICE\.md|\.firecrawl/|devbox/global|pytest_cache' \
            | xargs npx --yes oxfmt@0.58.0 --check

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.lua == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          echo "Running ShellCheck..."
          # Install shellcheck if not present (ubuntu-latest usually has it)
          if ! command -v shellcheck &> /dev/null; then
            ok=0
            for i in 1 2 3; do
              sudo timeout 120 apt-get update && { ok=1; break; }
              echo "apt-get update attempt $i failed; retrying"
              sleep 5
            done
            [ "$ok" = 1 ]
            sudo timeout 300 apt-get install -y shellcheck
          fi
          
          # Check install.sh, chezmoi scripts, CI helpers, and Bash regression tests
          find . -type f \( -name "install.sh" -o -path "./home/.chezmoiscripts/*.sh" -o -path "./home/dot_config/direnv/direnvrc" -o -path "./.github/scripts/install-chezmoi.sh" -o -path "./tests/devbox/*.sh" -o -path "./tests/zsh/*.test.sh" \) -print0 | xargs -0 shellcheck

  zsh-darwin:
    name: Zsh Syntax (macOS)
    needs: changes
    if: needs.changes.outputs.zsh == 'true'
    timeout-minutes: 10
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Install chezmoi in runner temp
        run: |
          bash .github/scripts/install-chezmoi.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check Darwin zsh syntax
        run: just lint-zsh

  chezmoi:
    name: Chezmoi (${{ matrix.os }}, ${{ matrix.env_name }})
    needs: changes
    if: needs.changes.outputs.chezmoi == 'true'
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        env_name: [personal, business]
        include:
          - env_name: personal
            business_use: ''
          - env_name: business
            business_use: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          bash .github/scripts/install-chezmoi.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Setup test config (provide prompted values)
        run: |
          mkdir -p ~/.config/chezmoi
          cat > ~/.config/chezmoi/chezmoi.yaml << 'EOF'
          data:
            name: "Test User"
            email: "test@example.com"
            work_email: "test@work.example.com"
          EOF

      - name: Test chezmoi init (dry-run)
        env:
          BUSINESS_USE: ${{ matrix.business_use }}
        run: |
          echo "Testing chezmoi template expansion..."
          chezmoi init --source="${PWD}" --dry-run --verbose

      - name: Verify template expansion
        env:
          BUSINESS_USE: ${{ matrix.business_use }}
        run: |
          set -euo pipefail

          chezmoi init --source="${PWD}"

          repo_root="$(pwd -P)"
          expected_source="${repo_root}"
          source_root_file="${repo_root}/.chezmoiroot"
          home_source="${repo_root}/home"
          if [[ -e "${source_root_file}" ]]; then
            if [[ ! -f "${source_root_file}" ]]; then
              echo ".chezmoiroot must be a regular file" >&2
              exit 1
            fi
            source_subdir="$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "${source_root_file}")"
            if [[ "${source_subdir}" != "home" ]]; then
              echo ".chezmoiroot must contain exactly 'home'" >&2
              exit 1
            fi
            if [[ ! -d "${home_source}" ]]; then
              echo ".chezmoiroot selects home, but home/ is not a directory" >&2
              exit 1
            fi
            expected_source="$(cd "${home_source}" && pwd -P)"
          elif [[ -e "${home_source}" ]]; then
            echo "home/ exists, but .chezmoiroot is missing" >&2
            exit 1
          fi

          actual_source="$(chezmoi --source="${repo_root}" source-path)"
          if [[ "${actual_source}" != "${expected_source}" ]]; then
            echo "Unexpected chezmoi source root" >&2
            echo "expected: ${expected_source}" >&2
            echo "actual:   ${actual_source}" >&2
            exit 1
          fi

          expected_git_source="${expected_source}/dot_config/git/config"
          actual_git_source="$(chezmoi --source="${repo_root}" source-path "${HOME}/.config/git/config")"
          if [[ "${actual_git_source}" != "${expected_git_source}" ]]; then
            echo "Unexpected source path for ~/.config/git/config" >&2
            echo "expected: ${expected_git_source}" >&2
            echo "actual:   ${actual_git_source}" >&2
            exit 1
          fi

          managed_files="$(chezmoi --source="${repo_root}" managed)"
          if ! grep -Fxq '.config/git/config' <<<"${managed_files}"; then
            echo "Managed files do not contain .config/git/config" >&2
            exit 1
          fi
          if grep -Fxq 'README.md' <<<"${managed_files}"; then
            echo "Repository-only README.md must not be managed" >&2
            exit 1
          fi

          chezmoi --source="${repo_root}" cat "${HOME}/.config/git/config"

  devbox:
    name: Devbox Validation (${{ matrix.profile }})
    needs: changes
    if: needs.changes.outputs.devbox == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [personal, business]
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          bash .github/scripts/install-chezmoi.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Render and validate profile manifests
        run: bash tests/devbox/render-and-assert.sh "$RUNNER_TEMP/devbox-profiles"

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.14.0
        with:
          enable-cache: true
          project-path: ${{ runner.temp }}/devbox-profiles/${{ matrix.profile }}

      - name: Test devbox packages
        run: |
          echo "Testing ${{ matrix.profile }} Devbox package resolution..."
          devbox install --config "$RUNNER_TEMP/devbox-profiles/${{ matrix.profile }}/devbox.json"

  neovim:
    name: Neovim Config
    needs: changes
    if: needs.changes.outputs.nvim == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim (stable)
        run: |
          curl -LO https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar xzf nvim-linux-x86_64.tar.gz
          sudo cp -r nvim-linux-x86_64/* /usr/local/

      - name: Setup Neovim config
        run: |
          mkdir -p ~/.config
          cp -r home/dot_config/nvim ~/.config/nvim

      - name: Test Neovim startup
        run: |
          echo "Testing Neovim startup..."
          timeout 60 nvim --headless -c 'qall' 2>&1

      - name: Validate init.lua
        run: nvim --headless -c 'lua print("init.lua OK")' -c 'qall' 2>&1

      - name: Test plugin config (Lazy sync)
        run: |
          echo "Testing plugin installation..."
          timeout 120 nvim --headless "+Lazy! sync" "+qa" 2>&1

  # Aggregator job for branch protection
  # This job always runs and reports success only if all required jobs passed or were skipped
  ci-complete:
    name: CI Complete
    needs: [changes, quality, format, lint, zsh-darwin, chezmoi, devbox, neovim]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"

          for result in $RESULTS; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "❌ CI failed: found $result"
              exit 1
            fi
          done

          echo "✅ CI complete: all jobs passed or were skipped"
