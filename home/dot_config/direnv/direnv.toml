# =============================================================================
# direnv configuration
# https://direnv.net/man/direnv.toml.1.html
# =============================================================================

[global]
# Hide the diff output when loading/unloading envrc
hide_env_diff = true

# Load data-only .env files through direnv's explicit allow/re-allow boundary.
# Requires direnv >= 2.31.0.
load_dotenv = true
