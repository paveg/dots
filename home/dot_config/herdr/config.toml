# herdr configuration — only deviations from `herdr --default-config` defaults

# onboarding flow already completed
onboarding = false

[theme]
name = "tokyo-night"

[keys]
# Match tmux prefix (dot_tmux.conf) so muscle memory carries over during the trial
prefix = "ctrl+a"

# prefix+|: side-by-side split, matching tmux `bind | split-window -h`
# (herdr default: prefix+v). The terminal delivers shift+backslash as the composed
# character `|`, so the binding must be the literal char — a "shift+backslash" chord
# never reaches herdr. Named punctuation (minus, comma, ...) is also accepted, which
# is why the stacked split uses split_horizontal = prefix+minus == tmux `bind -`.
split_vertical = "prefix+|"

# prefix+u: extract URLs from the focused pane's scrollback, fzf-pick, open
# (parity with tmux `bind u` in dot_tmux.conf). Popup keeps the tiled layout
# intact; HERDR_ACTIVE_PANE_ID still points at the pane that had focus.
[[keys.command]]
key = "prefix+u"
type = "popup"
command = "herdr-url-open"
description = "open URL from scrollback"
width = "80%"
height = "80%"

[experimental]
# macOS: switch to ASCII input source while prefix mode is active, so prefix
# commands register even when the Japanese IME is on (best-effort)
switch_ascii_input_source_in_prefix = true
pane_history = true

# macOS: keep the IME candidate window anchored to the pane cursor for TUIs that
# paint their own cursor. Scoped to Claude panes, so panes running an app that
# hides the cursor without painting a replacement keep the default behavior.
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]

[ui]
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true

# Attention-queue ordering for the agent panel, chosen through the Settings TUI.
# Recorded here so `chezmoi apply` does not revert it to the "spaces" default.
agent_panel_sort = "priority"

# Every pane here runs Claude, so the default ["agent"] row renders one identical
# "claude" label per entry and the priority ordering above becomes unreadable. The
# stripped terminal title carries the actual task, which is what distinguishes them.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.toast]
delivery = "terminal"
